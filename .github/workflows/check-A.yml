name: Check A
on:
  pull_request:
    types: [opened, synchronize, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action != 'labeled' && 'check' || github.run_id }}
  cancel-in-progress: true
permissions: {}
jobs:
  check:
    name: Check A
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Decide
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$ACTION" != labeled ]; then echo "mode=real" >> "$GITHUB_OUTPUT"; exit 0; fi
          prev=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=Check%20A&filter=all&per_page=100" --jq "[.check_runs[] | select((.details_url | contains(\"/runs/$RUN_ID/\")) | not) | select(.conclusion != \"skipped\")] | sort_by(.id) | last | (.status + \":\" + (.conclusion // \"none\"))")
          echo "earlier: $prev"
          case "$prev" in completed:success) echo "mode=copy-success" >> "$GITHUB_OUTPUT";; completed:failure) echo "mode=copy-failure" >> "$GITHUB_OUTPUT";; *) echo "mode=real" >> "$GITHUB_OUTPUT";; esac
      - if: steps.d.outputs.mode == 'real'
        run: sleep 90
      - if: steps.d.outputs.mode == 'copy-failure'
        run: exit 1
